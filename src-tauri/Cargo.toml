[package]
name = "token-console"
version = "0.1.0"
edition = "2021"
description = "WorkBuddy Token 消耗看板（Tauri 2 桌面版）"

[lib]
name = "token_console_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
chrono = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
